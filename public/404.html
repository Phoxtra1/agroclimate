<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agyenkwa — by Amineva Global</title>
    <script>
      // SPA fallback for static hosts: stash deep-link path and bounce to /
      // index.html will restore the URL with history.replaceState so React Router can render it.
      (function () {
        try {
          var path = window.location.pathname + window.location.search + window.location.hash;
          if (path && path !== "/") {
            sessionStorage.setItem("__spa_redirect", path);
          }
        } catch (e) {}
        window.location.replace("/");
      })();
    </script>
  </head>
  <body></body>
</html>
