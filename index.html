  <body>
    <div id="root"></div>
    <script>
      // SPA deep-link restore (paired with public/404.html). Runs before the app boots.
      (function () {
        try {
          var p = sessionStorage.getItem("__spa_redirect");
          if (p) {
            sessionStorage.removeItem("__spa_redirect");
            if (p !== window.location.pathname + window.location.search + window.location.hash) {
              history.replaceState(null, "", p);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
