name: Satellite feature validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/agroclimate-satellite"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satellite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Avoid external marketplace actions: use the runner's Git and Node.js.
      - name: Check out the exact event revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Verify Node.js and npm
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check application
        run: npx tsc --project tsconfig.app.json --noEmit --pretty false

      - name: Type-check build configuration
        run: npx tsc --project tsconfig.node.json --noEmit --pretty false

      # The repository-wide lint command currently fails on hundreds of
      # pre-existing findings in unrelated files and generated dev-dist output.
      # Gate this feature on lint for every source file changed by the PR.
      - name: Lint Satellite and new shared map components
        run: >-
          npx eslint
          src/pages/Satellite.tsx
          src/App.tsx
          src/components/AppLayout.tsx
          src/components/drone/DroneMissionLocationPanel.tsx
          src/components/satellite/GeoFeaturesMapLayer.tsx
          src/components/satellite/LandSuitabilityPanel.tsx
          src/components/satellite/PortsMapLayer.tsx
          src/pages/agtrans-partner/TripPage.tsx
          src/services/satellite/navigation.ts
          src/services/satellite/offlineNavigation.ts
          src/services/satellite/ports.ts
          src/services/satellite/sentinel.ts
          src/services/satellite/interpretation.ts
          src/test/satelliteSentinel.test.ts
          src/test/satelliteAnomaly.test.ts
          src/test/satelliteInterpretation.test.ts
          supabase/functions/_shared/satellite-anomaly.ts

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build
